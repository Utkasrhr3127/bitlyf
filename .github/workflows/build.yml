name: Build APK

# Runs on every push, and you can also start it by hand.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned so the Android SDK that comes with the machine stays the same.
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK. We only accept its licenses.
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: bitlyf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
